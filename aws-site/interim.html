<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
    <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
    <meta name="theme-color" content="#2d0e1b">
    <title>Still Between Us — Page temporarily unavailable</title>
    <style>
      :root { color-scheme: light; --ink:#1b0e12; --wine:#56182d; --paper:#fbf6ef; --muted:#806e68; --line:rgba(56,28,35,.17); }
      * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; display:grid; place-items:center; padding:30px; color:var(--ink); background:var(--paper); font-family:Arial,Helvetica,sans-serif; }
      main { width:min(720px,100%); padding:clamp(34px,7vw,72px); border:1px solid var(--line); background:rgba(255,255,255,.48); box-shadow:0 24px 70px rgba(65,31,38,.1); }
      .eyebrow { display:flex; align-items:center; gap:12px; margin:0 0 28px; color:var(--wine); font-size:.7rem; font-weight:700; letter-spacing:.17em; text-transform:uppercase; }
      .eyebrow::before { content:""; width:36px; height:1px; background:currentColor; }
      h1 { margin:0; font:400 clamp(3.2rem,10vw,6.2rem)/.92 Georgia,"Times New Roman",serif; letter-spacing:-.055em; }
      p:last-child { max-width:540px; margin:30px 0 0; color:var(--muted); font:1.05rem/1.75 Georgia,"Times New Roman",serif; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Permission review in progress</p>
      <h1>Still Between Us</h1>
      <p>This promotional page is temporarily unavailable while artist and artwork permissions are documented. No music player or promotional tracking is active on this page.</p>
    </main>
  </body>
