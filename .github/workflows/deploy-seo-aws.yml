name: Deploy Still Between Us SEO to AWS

on:
  push:
    branches:
      - initial_branch
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: stillbetweenus-seo-production
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "765332581359"
  S3_BUCKET: stillbetweenus-seo-765332581359
  CLOUDFRONT_DISTRIBUTION_ID: E6OZS6V38E22G

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out initial_branch
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and test the permission-pending site
        # Switch back to `npm run test:aws` only after the signed authorization
        # has been verified and the approval change is reviewed.
        run: npm run test:aws:interim

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/StillBetweenUsGithubDeployRole
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: stillbetweenus-${{ github.run_id }}

      - name: Publish static assets
        run: >-
          aws s3 sync aws-dist/ s3://${S3_BUCKET}/
          --delete
          --cache-control "public,max-age=300"

      - name: Keep HTML immediately refreshable
        run: |
          aws s3 cp aws-dist/index.html s3://${S3_BUCKET}/index.html --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html; charset=utf-8"
          aws s3 cp aws-dist/404.html s3://${S3_BUCKET}/404.html --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html; charset=utf-8"

      - name: Refresh the global CDN
        run: aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
